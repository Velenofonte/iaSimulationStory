# Setting pack for the episode / notoriety engines.
# Labels and bands are story-local; the engine treats them as opaque strings/ints.

tiers:
  0: niente
  1: segno  # deprecated — never sampled; mass redistributed to T0/T2
  2: gancio
  3: frizione
  4: complicazione
  5: minaccia
  6: svolta

# Index 1 is always 0. Ex-T1 mass: ~70% → T0, ~30% → T2.
location_kinds:
  default:      [61, 0, 16, 10, 7, 4, 2]
  settlement:   [56, 0, 24, 12, 5, 2, 1]
  inn:          [52, 0, 28, 15, 4, 1, 0.2]
  road:         [53, 0, 15, 12, 12, 7, 1]
  wilderness:   [41, 0, 11, 8, 16, 18, 6]
  outpost:      [50, 0, 15, 10, 14, 9, 2]
  ruin:         [44, 0, 14, 10, 15, 12, 5]

modifiers:
  night:            [0.7, 0.0, 0.7, 0.9, 1.2, 1.5, 1.3]
  alone:            [1.0, 0.0, 0.5, 0.6, 1.1, 1.4, 1.1]
  indoor:           [1.1, 0.0, 1.3, 1.3, 0.8, 0.5, 0.4]
  stance_wait:      [0.35, 0.0, 1.2, 1.2, 1.3, 1.4, 1.2]
  stance_wait_repeat: [6.0, 0.0, 0.5, 0.4, 0.3, 0.2, 0.15]
  stance_dialogue:  [3.0, 0.0, 0.6, 0.5, 0.35, 0.2, 0.12]
  cooldown:         [3.0, 0.0, 0.5, 0.45, 0.3, 0.15, 0.1]
  quiet_streak:     [0.85, 0.0, 1.1, 1.1, 1.15, 1.2, 1.15]
  baseline_calm:    [1.15, 0.0, 1.05, 0.95, 0.95, 0.95, 0.95]

kinds:
  threat:
    tiers: [4, 5, 6]
    by_location:
      default: 1.0
      settlement: 0.4
      inn: 0.2
      road: 1.2
      wilderness: 1.8
      outpost: 1.1
      ruin: 1.4
  social:
    tiers: [2, 3, 4]
    by_location:
      default: 1.0
      settlement: 1.5
      inn: 2.0
      road: 0.6
      wilderness: 0.2
      outpost: 0.7
      ruin: 0.4
  discovery:
    tiers: [2, 4]
    by_location:
      default: 1.0
      settlement: 0.6
      inn: 0.4
      road: 1.0
      wilderness: 1.3
      outpost: 1.1
      ruin: 1.6
  arrival:
    tiers: [2, 3, 4, 5]
    by_location:
      default: 1.0
      settlement: 1.2
      inn: 1.3
      road: 0.8
      wilderness: 0.5
      outpost: 1.4
      ruin: 0.7
  environmental:
    tiers: [3, 4, 5]
    by_location:
      default: 1.0
      settlement: 0.5
      inn: 0.3
      road: 1.1
      wilderness: 1.5
      outpost: 1.0
      ruin: 1.2
  opportunity:
    tiers: [2, 3]
    by_location:
      default: 1.0
      settlement: 1.4
      inn: 1.6
      road: 0.7
      wilderness: 0.3
      outpost: 0.8
      ruin: 0.5
  mystery:
    tiers: [2, 4, 6]
    by_location:
      default: 1.0
      settlement: 0.8
      inn: 0.7
      road: 0.9
      wilderness: 1.2
      outpost: 1.3
      ruin: 1.5

# Reweight kind selection from notoriety / gap (phase 2).
notoriety_kind_weights:
  low:
    social: 1.2
    opportunity: 1.3
    discovery: 1.1
    threat: 0.8
    arrival: 1.0
    environmental: 1.0
    mystery: 0.9
  high:
    social: 0.7
    opportunity: 0.6
    discovery: 0.8
    threat: 0.9
    arrival: 1.4
    environmental: 0.7
    mystery: 1.5
  gap_high:
    social: 0.8
    opportunity: 0.7
    discovery: 0.9
    threat: 0.8
    arrival: 1.3
    environmental: 0.6
    mystery: 1.6

exposure:
  witness_reach:
    civilian: local
    merchant: city
    adventurer: city
    guard: city
    clerk: city
    noble: region
    priest: region
    officer: region
    agent: nation
  thresholds:
    low: 0
    medium: 2
    high: 5

scale_bands:
  F:
    weight: 1
    expected_label_rank: 0
  E:
    weight: 2
    expected_label_rank: 1
  D:
    weight: 4
    expected_label_rank: 2
  C:
    weight: 8
    expected_label_rank: 3
  B:
    weight: 16
    expected_label_rank: 4
  A:
    weight: 32
    expected_label_rank: 5
  A+:
    weight: 48
    expected_label_rank: 6
  A++:
    weight: 72
    expected_label_rank: 7
  "100+":
    weight: 120
    expected_label_rank: 8

formal_labels:
  copper: 0
  iron: 1
  silver: 2
  gold: 3
  platinum: 4
  mithril: 5
  orichalcum: 6
  adamantite: 7

reach_order: [none, local, city, region, nation, beyond]

beneficiary_reach:
  none: none
  civilian: local
  merchant: city
  noble: region
  faction: nation
  nation: beyond

decay:
  score_per_day: 0.5
  legend_per_day: 0.2
  persistent_evidence_exempt: true
